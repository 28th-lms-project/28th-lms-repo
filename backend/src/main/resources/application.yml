logging:
  level:
    root: debug

spring:
  application:
    name: learningworks
  # DB 설정
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@192.168.211.20:1521:XE
    username: LEARNING_WORKS
    password: LEARNING_WORKS_1234
  # 파일 업로드 크기 제한 (교육 자료 파일 10MB)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# MyBatis 설정
mybatis:
  config-location: classpath:config/mybatis-config.xml
  mapper-locations: classpath*:com/learningworks/**/dao/mapper/*DaoMapper.xml

app:
  # JWT 설정
  jwt:
    secret-key: gwcR4tHA5Pvn3iApesLgqq0tcY1nLzuyrRRt7/q6lc0=
    access-token-validity-seconds: 604800
  # API 권한 검사 (@RequireAction, @RequireSuperAdmin, @LoginRequired, @PublicApi). 사용법: backend/docs/access-control-guide.md
  access-check:
    enabled: true
    # 권한 어노테이션이 없는 API는 SUPER_ADMIN만 호출 가능 (false로 바꾸면 누구나 호출 가능)
    default-super-admin: true
  # 교육 자료 첨부 파일 저장 경로 (웹 루트 외부). 환경별로 COURSE_DATA_UPLOAD_DIR 환경변수로 변경 가능
  course-data:
    upload-dir: ${COURSE_DATA_UPLOAD_DIR:${user.home}/learningworks/upload/course-data}
  attendance:
    late-time: "09:10" # 이 시각까지 누르면 출석(Y), 넘으면 지각(L). 반드시 두 자리 HH:mm
    absent-time: "13:00" # 이 시각까지 누르면 지각(L), 넘으면 결석(N)
